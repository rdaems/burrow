<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>burrow</title>
<script src="/pixel.js"></script>
<script src="/room.js"></script>
<script src="/chessboard.js"></script>
<script src="/pong.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="/burrow.css">
</head>
<body class="empty">
<header>
  <div class="top">
    <span class="mark">BURROW</span>
    <div class="t"><h1 id="who"></h1><span id="as"></span></div>
    <button id="reconnect" class="btn" hidden>reconnect</button>
    <button id="stop" class="btn">stop</button>
    <button id="close" class="btn" title="close (the session keeps running)">✕</button>
  </div>
</header>
<main id="app">
  <div id="roomwrap"><canvas id="room"></canvas></div>
  <section id="pane" class="empty">
    <div id="term"></div>
    <div id="chess" class="side" hidden></div>
    <div id="pong" class="pong" hidden></div>
  </section>
</main>

<dialog id="dirDialog">
  <form method="dialog">
    <h2>add a project</h2>
    <p>A working directory on <b class="machine"></b>. Its bots will sit at one desk.</p>
    <input class="field" name="dir" placeholder="~/projects/something" autocomplete="off" spellcheck="false">
    <div class="err"></div>
  </form>
</dialog>
<dialog id="roomDialog">
  <form method="dialog">
    <h2>add a machine</h2>
    <p>Reached over ssh, as <code>ssh</code> would (your ~/.ssh/config applies). Nothing gets installed there.</p>
    <input class="field" name="ssh" placeholder="odyssey" autocomplete="off" spellcheck="false">
    <input class="field" name="name" placeholder="its name on the wall (optional)" autocomplete="off" spellcheck="false">
    <div class="err"></div>
  </form>
</dialog>

<script>
// burrow's page: the room (room.js) on the left, always the same; the session of the bot you clicked
// on the right (`claude attach`, in xterm.js, through server.py), an empty screen when none is open.
// Closing it only detaches. The pointer on either side lights up the other: the bot and its session.
let state = null, cur = 0, open = null;
const $ = (s) => document.querySelector(s);
const api = async (path, body) => (await fetch(path, { method: "POST", body: JSON.stringify(body || {}) })).json();
try { cur = +localStorage.getItem("burrow.room") || 0; } catch {}

const room = startRoom($("#room"), {
  state: () => state,
  cur: () => cur,
  open: () => open && open.room === cur ? open.id : null,
  pong: () => (pongRoom === cur ? pongUI.playing() : null),
  hl: () => paneHover && open && open.room === cur ? open.id : null,
  hover: (id) => $("#pane").classList.toggle("hl", !!open && open.room === cur && open.id === id),
  act,
});
let paneHover = false;
$("#pane").addEventListener("pointerenter", () => { paneHover = true; room.draw(); });
$("#pane").addEventListener("pointerleave", () => { paneHover = false; room.draw(); });

async function act(a) {
  if (a.kind === "room") { cur = a.i; try { localStorage.setItem("burrow.room", cur); } catch {} room.draw(); }
  else if (a.kind === "addRoom") ask($("#roomDialog"));
  else if (a.kind === "addDir") ask($("#dirDialog"));
  else if (a.kind === "open") openBot(cur, a.id);
  else if (a.kind === "chess") openChess();
  else if (a.kind === "pong") openPong();
  else if (a.kind === "forget") await api("/api/forget", { room: cur, dir: a.dir });
  else if (a.kind === "layout") await api("/api/layout", { room: cur, layout: a.layout });
  else if (a.kind === "stop") stopBot(cur, a.id);
  else if (a.kind === "drop") { openBot(cur, a.id); for (const f of a.files) await hand(f); }
  else if (a.kind === "spawn") {
    const r = await api("/api/spawn", { room: cur, dir: a.dir });
    if (r.error) note(r.error); else openBot(cur, r.id);
  }
}
function note(msg) {                       // trouble goes on the wall, like a failed poll
  const r = state && state.rooms[cur];
  if (r) { r.error = msg; room.draw(); }
}

// ---- the feed
const es = new EventSource("/events");
es.addEventListener("state", (e) => {
  state = JSON.parse(e.data);
  if (cur >= state.rooms.length) cur = 0;
  if (open) showWho();
  if (playing !== null) showChess();
  // a bot that gets work, or a question for you, leaves the ping-pong table
  const pp = pongRoom !== null && pongUI.playing();
  if (pp && !(state.rooms[pongRoom].bots || []).some((b) => b.id === pp.id && !b.busy && !b.waiting)) pongUI.left();
  room.draw();
});
es.addEventListener("talk", (e) => { const t = JSON.parse(e.data); room.talk(t.room, t.from, t.to); });
const focus = () => api("/api/focus", { on: document.hasFocus() && !document.hidden });
addEventListener("focus", focus); addEventListener("blur", focus); document.addEventListener("visibilitychange", focus);

// ---- dialogs: Enter adds, Esc closes
function ask(d) {
  d.querySelector(".err").textContent = "";
  const m = d.querySelector(".machine");
  if (m && state) m.textContent = state.rooms[cur].name;
  d.querySelectorAll("input").forEach((i) => (i.value = ""));
  d.showModal();
  d.querySelector("input").focus();
}
for (const d of [$("#dirDialog"), $("#roomDialog")]) {
  d.addEventListener("click", (e) => { if (e.target === d) d.close(); });
  d.querySelector("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)), err = d.querySelector(".err");
    err.textContent = "…";
    const r = d.id === "dirDialog" ? await api("/api/dir", { room: cur, dir: f.dir }) : await api("/api/room", f);
    if (r.error) { err.textContent = r.error; return; }
    if (r.room !== undefined) cur = r.room;
    d.close();
  });
}

// ---- a session: the real claude TUI, attached over a websocket
const DARK = { background: "#140f1e", foreground: "#e6e1ef", cursor: "#e6e1ef", selectionBackground: "#d9775766",
  black: "#2a2140", red: "#e8402a", green: "#5fcf4a", yellow: "#f2a531", blue: "#4a76b8", magenta: "#9a74d6", cyan: "#2fa087", white: "#c2c9d9",
  brightBlack: "#5d6280", brightRed: "#ff6b5a", brightGreen: "#8ee07a", brightYellow: "#ffe27a", brightBlue: "#8fc0e8", brightMagenta: "#c4a8f0", brightCyan: "#7fdcb0", brightWhite: "#f4f6fb" };
const LIGHT = { background: "#fbf8f1", foreground: "#140f1e", cursor: "#140f1e", selectionBackground: "#d9775755",
  black: "#140f1e", red: "#b8321f", green: "#2d8a3a", yellow: "#a8650f", blue: "#2c4580", magenta: "#5a3f94", cyan: "#1b6660", white: "#8b93ad",
  brightBlack: "#5d6280", brightRed: "#e8402a", brightGreen: "#3f9e2f", brightYellow: "#b86a1e", brightBlue: "#4a76b8", brightMagenta: "#9a74d6", brightCyan: "#2fa087", brightWhite: "#3b3a55" };
const term = new Terminal({ fontFamily: '"Burrow Mono", "JetBrains Mono", Menlo, monospace', fontSize: 13, lineHeight: 1.15,
  cursorBlink: true, allowProposedApi: true, theme: DARK, scrollback: 5000, macOptionIsMeta: true });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
let termOpened = false, ws = null;
const enc = new TextEncoder();
term.onData((d) => ws && ws.readyState === 1 && ws.send(enc.encode(d)));
term.onBinary((d) => ws && ws.readyState === 1 && ws.send(Uint8Array.from(d, (c) => c.charCodeAt(0))));
term.onResize(({ cols, rows }) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ size: [cols, rows] })));

function bot() { return open && state && (state.rooms[open.room].bots || []).find((b) => b.id === open.id); }
function showWho() {
  const b = bot();
  $("#who").textContent = b ? b.name : open.id;
  $("#as").textContent = state ? "on " + state.rooms[open.room].name : "";
  term.options.theme = state && state.rooms[open.room].light ? LIGHT : DARK;
}
function openBot(ri, id) {
  if (open && open.room === ri && open.id === id) { term.focus(); return; }
  closeBot(); closeChess(); closePong();
  open = { room: ri, id };
  $("#pane").classList.remove("empty"); document.body.classList.remove("empty");
  if (!termOpened) { term.open($("#term")); termOpened = true; }
  term.reset();
  showWho();
  stopping(false);
  requestAnimationFrame(() => { fit.fit(); connect(); term.focus(); });
}
function connect() {
  $("#reconnect").hidden = true;
  const s = new WebSocket(`ws://${location.host}/term?room=${open.room}&id=${encodeURIComponent(open.id)}`);
  s.binaryType = "arraybuffer";
  s.onopen = () => { s.send(JSON.stringify({ size: [term.cols, term.rows] })); setTimeout(() => { for (const t of typed.splice(0)) if (ws === s) s.send(enc.encode(t)); }, 1000); };
  s.onmessage = (e) => term.write(new Uint8Array(e.data));
  s.onclose = () => { if (ws === s) { ws = null; $("#reconnect").hidden = false; } };
  ws = s;
}
function closeBot() {
  if (ws) { const s = ws; ws = null; s.close(); }
  open = null;
  $("#who").textContent = ""; $("#as").textContent = "";
  $("#pane").classList.add("empty"); $("#pane").classList.remove("hl"); document.body.classList.add("empty");
  room.draw();
}
async function stopBot(ri, id) {
  if (open && open.room === ri && open.id === id) closeBot();
  const r = await api("/api/stop", { room: ri, id });
  if (r.error) note(r.error);
}
function stopping(on) { $("#stop").textContent = on ? "really stop?" : "stop"; $("#stop").classList.toggle("warn", on); }
$("#close").onclick = () => { closeBot(); closeChess(); closePong(); };
$("#reconnect").onclick = () => { term.reset(); connect(); term.focus(); };
$("#stop").onclick = async () => {
  if (!$("#stop").classList.contains("warn")) { stopping(true); setTimeout(() => stopping(false), 3000); return; }
  stopBot(open.room, open.id);
};
new ResizeObserver(() => { if (open) fit.fit(); }).observe($("#term"));

// ---- the chess table: pair's board in the pane, against one of the room's idle bots
let playing = null;                        // the room whose chess table is open
const projectColor = (cwd) => room.color(cwd);
const botFace = (p) => {
  const b = state && (state.rooms[playing ?? cur].bots || []).find((x) => x.id === p.id);
  return pixelAvatar(p.id, "agent", b ? projectColor(b.cwd) : "#8b93ad");
};
const chessUI = chessPanel($("#chess"), {
  post: async (body) => { const r = await api("/api/chess", { room: playing, ...body }); return { ok: !r.error, json: async () => r }; },
  me: () => "you",
  people: () => ((state && state.rooms[playing].bots) || []).filter((b) => b.background && !b.busy && !b.waiting)
    .map((b) => ({ id: b.id, name: b.name, kind: "agent", present: true, color: projectColor(b.cwd) })),
  face: (p) => p.id === "you" ? "" : `<span class="pic"><img src="${botFace(p)}" alt=""></span>`,
  small: (p) => `<img class="sm" src="${botFace(p)}" alt="">`,
});
function openChess() {
  closeBot(); closePong();
  playing = cur;
  $("#pane").classList.remove("empty"); document.body.classList.remove("empty");
  $("#pane").classList.add("chessing"); document.body.classList.add("chessing"); $("#chess").hidden = false;
  showChess();
}
function showChess() {
  const v = state.rooms[playing].chess;
  const it = v && (v.white.id === "you" ? v.black : v.white);
  if (it) { it.color = projectColor(((state.rooms[playing].bots || []).find((b) => b.id === it.id) || {}).cwd || ""); }
  if (v) v.white.color = v.white.color || "#d97757", v.black.color = v.black.color || "#d97757";
  $("#who").textContent = it ? "chess with " + it.name : "chess";
  $("#as").textContent = "on " + state.rooms[playing].name;
  chessUI.update(v);
}
function closeChess() {
  if (playing === null) return;
  playing = null; $("#chess").hidden = true; $("#pane").classList.remove("chessing"); document.body.classList.remove("chessing");
  $("#pane").classList.add("empty"); document.body.classList.add("empty");
  $("#who").textContent = ""; $("#as").textContent = "";
}

// ---- the ping-pong table: pair's game in the pane, against one of the room's idle bots
let pongRoom = null;
const idleBots = (ri) => ((state && state.rooms[ri].bots) || []).filter((b) => b.background && !b.busy && !b.waiting)
  .map((b) => ({ id: b.id, name: b.name, kind: "agent", present: true, color: projectColor(b.cwd) }));
const pongUI = pongTable($("#pong"), {
  me: () => "you", people: () => idleBots(pongRoom ?? cur),
  small: (p) => `<img class="sm" src="${pixelAvatar(p.id, "agent", p.color)}" alt="">`,
  post: async () => ({}), api: () => "",
});
function openPong() {
  closeBot(); closeChess();
  pongRoom = cur;
  $("#pane").classList.remove("empty"); $("#pane").classList.add("chessing"); document.body.classList.add("chessing"); document.body.classList.remove("empty");
  $("#who").textContent = "ping-pong"; $("#as").textContent = "on " + state.rooms[cur].name;
  pongUI.open();
}
function closePong() {
  if (pongRoom === null) return;
  pongRoom = null;
  if (!$("#pong").hidden) pongUI.close();
  $("#pane").classList.add("empty"); $("#pane").classList.remove("chessing"); document.body.classList.remove("chessing"); document.body.classList.add("empty");
  $("#who").textContent = ""; $("#as").textContent = "";
}
// its own ✕ (or Esc) closes the card: then the pane is empty again
new MutationObserver(() => { if ($("#pong").hidden && pongRoom !== null) closePong(); }).observe($("#pong"), { attributes: true, attributeFilter: ["hidden"] });

// drop a file on the session: its path gets typed in, as in a terminal (copied over first for a remote machine)
const pane = $("#pane");
pane.addEventListener("dragover", (e) => { e.preventDefault(); pane.classList.add("drop"); });
pane.addEventListener("dragleave", () => pane.classList.remove("drop"));
const typed = [];                          // for a session still connecting
async function hand(file) {
  const o = open;
  const r = await (await fetch(`/api/upload?room=${o.room}&name=${encodeURIComponent(file.name)}`, { method: "POST", body: file })).json();
  if (r.error) return note(r.error);
  const t = (/[\s'"\\]/.test(r.path) ? "'" + r.path.replace(/'/g, "'\\''") + "'" : r.path) + " ";
  if (ws && ws.readyState === 1 && open === o) ws.send(enc.encode(t)); else if (open === o) typed.push(t);
  term.focus();
}
pane.addEventListener("drop", async (e) => {
  e.preventDefault(); pane.classList.remove("drop");
  if (open) for (const file of e.dataTransfer.files) await hand(file);
});
addEventListener("keydown", (e) => { if (e.key === "Escape" && document.activeElement === document.body) { closeBot(); closeChess(); closePong(); } });
</script>
</body>
</html>
