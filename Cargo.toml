[package]
name = "burrow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Persistent Claude Code sessions on your machines, shown as bots in a room"
repository = "https://github.com/rdaems/burrow"

[dependencies]
alacritty_terminal = "0.26.0"
eframe = "0.37.0"
egui = "0.37"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
