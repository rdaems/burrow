# burrow, native: the room as a macOS app on GPUI (Zed's UI framework).
#   room/  everything that is burrow, no GPUI: state, the room's logic, its pixel art drawn into a buffer
#   app/   the GPUI shell: the window, events, painting the room's buffer, terminals, panels
[workspace]
resolver = "3"
members = ["crates/pix", "crates/model", "crates/room", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/rdaems/burrow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2            # GPUI and the rest fast even in a debug build

[profile.release]
opt-level = 3
lto = "thin"
strip = true
