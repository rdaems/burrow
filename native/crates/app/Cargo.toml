[package]
name = "burrow-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "burrow as a native macOS app"

[[bin]]
name = "burrow"
path = "src/main.rs"

[dependencies]
burrow-room = { path = "../room" }
burrow-model = { path = "../model" }
burrow-core = { path = "../core" }
burrow-games = { path = "../games" }
burrow-sound = { path = "../sound" }
burrow-term = { path = "../term" }
futures = "0.3"
raw-window-handle = "0.6"
objc = "0.2"
pix = { path = "../pix" }
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
