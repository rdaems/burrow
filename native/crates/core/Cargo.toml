[package]
name = "burrow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "burrow's backend: Claude Code's sessions on every machine, room.json, terminals, the notes (a port of web/server.py)"

[dependencies]
burrow-model = { path = "../model" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }   # Claude Code's settings.json written back in its own order
regex = "1.13"
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27"
